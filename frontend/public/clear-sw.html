<!DOCTYPE html>
<html>
<head>
    <title>Clear Service Worker</title>
</head>
<body>
    <h1>Clearing Service Worker...</h1>
    <div id="status">Working...</div>
    
    <script>
        async function clearServiceWorker() {
            const statusDiv = document.getElementById('status');
            
            try {
                // Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log('Unregistered service worker:', registration);
                    }
                    statusDiv.innerHTML = `Unregistered ${registrations.length} service worker(s). <br><br>Now you can close this tab and reload your app.`;
                } else {
                    statusDiv.innerHTML = 'Service Worker not supported in this browser.';
                }
                
                // Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(
                        cacheNames.map(cacheName => caches.delete(cacheName))
                    );
                    console.log('Cleared all caches:', cacheNames);
                    statusDiv.innerHTML += `<br>Cleared ${cacheNames.length} cache(s).`;
                }
                
                // Clear storage
                localStorage.clear();
                sessionStorage.clear();
                statusDiv.innerHTML += '<br>Cleared localStorage and sessionStorage.';
                
                statusDiv.innerHTML += '<br><br><strong>✅ All cleared! You can now close this tab and reload your app.</strong>';
                
            } catch (error) {
                console.error('Error clearing service worker:', error);
                statusDiv.innerHTML = 'Error: ' + error.message;
            }
        }
        
        // Run immediately when page loads
        clearServiceWorker();
    </script>
</body>
</html>
