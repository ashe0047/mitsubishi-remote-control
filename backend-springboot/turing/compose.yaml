services:
  turing-server:
    image: openjdk:21-jdk-slim
    container_name: turing-server
    ports:
      - "8081:8081"
    volumes:
      - ./target/turing-server-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    working_dir: /app
    command: ["sh", "-c", "apt-get update && apt-get install -y curl && java -jar app.jar"]
    environment:
      # Server Configuration
      - SERVER_PORT=8081
      
      # MQTT Configuration
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-10.0.16.3}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_BROKER_USERNAME=${MQTT_BROKER_USERNAME:-mqtt-service}
      - MQTT_BROKER_PASSWORD=${MQTT_BROKER_PASSWORD:-asus1122334455}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-turing-server}
      - MQTT_KEEP_ALIVE=${MQTT_KEEP_ALIVE:-60}
      - MQTT_CONNECTION_TIMEOUT=${MQTT_CONNECTION_TIMEOUT:-30}
      - MQTT_CLEAN_SESSION=${MQTT_CLEAN_SESSION:-true}
      - MQTT_RECONNECT_ATTEMPTS=${MQTT_RECONNECT_ATTEMPTS:-3}
      - MQTT_RECONNECT_DELAY=${MQTT_RECONNECT_DELAY:-5000}
      - MQTT_BASE_TOPIC=${MQTT_BASE_TOPIC:-mitsubishi2mqtt}
      
      # Database Configuration
      - DB_URL=${DB_URL:-r2dbc:postgresql://localhost:5432/turing_dev}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_POOL_INITIAL=${DB_POOL_INITIAL:-5}
      - DB_POOL_MAX=${DB_POOL_MAX:-20}
      - DB_POOL_IDLE=${DB_POOL_IDLE:-30m}
      - DB_POOL_ACQUIRE=${DB_POOL_ACQUIRE:-3s}
      - DB_POOL_CREATE=${DB_POOL_CREATE:-3s}
      
      # Flyway Configuration
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-true}
      - FLYWAY_URL=${FLYWAY_URL:-jdbc:postgresql://localhost:5432/turing_dev}
      - FLYWAY_USER=${FLYWAY_USER:-postgres}
      - FLYWAY_PASSWORD=${FLYWAY_PASSWORD:-postgres}
      - FLYWAY_LOCATIONS=${FLYWAY_LOCATIONS:-classpath:db/migration}
      - FLYWAY_BASELINE=${FLYWAY_BASELINE:-true}
      - FLYWAY_VALIDATE=${FLYWAY_VALIDATE:-true}
      
      # Redis Configuration
      - QUOTA_REDIS_HOST=${QUOTA_REDIS_HOST:-localhost}
      - QUOTA_REDIS_PORT=${QUOTA_REDIS_PORT:-6379}
      - QUOTA_REDIS_PASSWORD=${QUOTA_REDIS_PASSWORD:-}
      - QUOTA_REDIS_DATABASE=${QUOTA_REDIS_DATABASE:-0}
      - QUOTA_REDIS_TIMEOUT=${QUOTA_REDIS_TIMEOUT:-2s}
      - QUOTA_REDIS_POOL_MAX_ACTIVE=${QUOTA_REDIS_POOL_MAX_ACTIVE:-8}
      - QUOTA_REDIS_POOL_MAX_IDLE=${QUOTA_REDIS_POOL_MAX_IDLE:-8}
      - QUOTA_REDIS_POOL_MIN_IDLE=${QUOTA_REDIS_POOL_MIN_IDLE:-0}
      - QUOTA_REDIS_POOL_MAX_WAIT=${QUOTA_REDIS_POOL_MAX_WAIT:--1ms}
      
      # Security Configuration
      - JWT_SECRET=${JWT_SECRET:-your-256-bit-secret-key-for-quota-management-change-in-production}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      
      # Quota Configuration
      - QUOTA_ENABLED=${QUOTA_ENABLED:-false}
      - QUOTA_BETA_MODE=${QUOTA_BETA_MODE:-false}
      - QUOTA_EMERGENCY_DISABLE=${QUOTA_EMERGENCY_DISABLE:-false}
      - QUOTA_ROLLOUT_PERCENTAGE=${QUOTA_ROLLOUT_PERCENTAGE:-0}
      - QUOTA_ENABLED_HOUSEHOLDS=${QUOTA_ENABLED_HOUSEHOLDS:-}
      - QUOTA_DISABLED_HOUSEHOLDS=${QUOTA_DISABLED_HOUSEHOLDS:-}
      
      # Quota Performance Settings
      - QUOTA_VALIDATION_TIMEOUT=${QUOTA_VALIDATION_TIMEOUT:-100ms}
      - QUOTA_CACHE_TTL=${QUOTA_CACHE_TTL:-3600s}
      - QUOTA_SHORT_CACHE_TTL=${QUOTA_SHORT_CACHE_TTL:-300s}
      - QUOTA_VALIDATION_RETRIES=${QUOTA_VALIDATION_RETRIES:-2}
      
      # Quota Usage Tracking
      - QUOTA_USAGE_TRACKING_ENABLED=${QUOTA_USAGE_TRACKING_ENABLED:-true}
      - QUOTA_USAGE_BATCH_SIZE=${QUOTA_USAGE_BATCH_SIZE:-100}
      - QUOTA_USAGE_FLUSH_INTERVAL=${QUOTA_USAGE_FLUSH_INTERVAL:-30s}
      - QUOTA_SESSION_TIMEOUT=${QUOTA_SESSION_TIMEOUT:-24h}
      
      # Quota Notifications
      - QUOTA_NOTIFICATIONS_ENABLED=${QUOTA_NOTIFICATIONS_ENABLED:-true}
      - QUOTA_WARNING_THRESHOLD=${QUOTA_WARNING_THRESHOLD:-75}
      - QUOTA_VIOLATION_THRESHOLD=${QUOTA_VIOLATION_THRESHOLD:-100}
      - QUOTA_NOTIFICATION_COOLDOWN=${QUOTA_NOTIFICATION_COOLDOWN:-300s}
      
      # Quota Enforcement
      - QUOTA_ENFORCEMENT_ENABLED=${QUOTA_ENFORCEMENT_ENABLED:-true}
      - QUOTA_GRACE_PERIOD=${QUOTA_GRACE_PERIOD:-300s}
      - QUOTA_MAX_GRACE_USES=${QUOTA_MAX_GRACE_USES:-1}
      - QUOTA_EMERGENCY_OVERRIDE=${QUOTA_EMERGENCY_OVERRIDE:-true}
      
      # Quota Cache
      - QUOTA_CACHE_DEFAULT_TTL=${QUOTA_CACHE_DEFAULT_TTL:-3600s}
      - QUOTA_CACHE_BALANCE_TTL=${QUOTA_CACHE_BALANCE_TTL:-1800s}
      - QUOTA_CACHE_CONFIG_TTL=${QUOTA_CACHE_CONFIG_TTL:-86400s}
      - QUOTA_CACHE_SESSION_TTL=${QUOTA_CACHE_SESSION_TTL:-86400s}
      
      # Quota Performance Monitoring
      - QUOTA_SLOW_QUERY_THRESHOLD=${QUOTA_SLOW_QUERY_THRESHOLD:-100ms}
      - QUOTA_QUERY_LOGGING=${QUOTA_QUERY_LOGGING:-false}
      - QUOTA_CIRCUIT_BREAKER=${QUOTA_CIRCUIT_BREAKER:-true}
      - QUOTA_CIRCUIT_BREAKER_THRESHOLD=${QUOTA_CIRCUIT_BREAKER_THRESHOLD:-50}
      - QUOTA_CIRCUIT_BREAKER_TIMEOUT=${QUOTA_CIRCUIT_BREAKER_TIMEOUT:-30s}
      
      # Management and Monitoring
      - METRICS_CORS_ORIGINS=${METRICS_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
      - PROMETHEUS_STEP=${PROMETHEUS_STEP:-30s}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      
      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_LOG_LEVEL=${SERVICE_LOG_LEVEL:-DEBUG}
      - R2DBC_LOG_LEVEL=${R2DBC_LOG_LEVEL:-WARN}
      - REDIS_LOG_LEVEL=${REDIS_LOG_LEVEL:-WARN}
      - NETTY_LOG_LEVEL=${NETTY_LOG_LEVEL:-WARN}
      
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - turing-network

networks:
  turing-network:
    driver: bridge
