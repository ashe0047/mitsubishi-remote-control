# Quota Management Configuration
# This configuration file contains all settings for the quota management system

spring:
  # Database Configuration (R2DBC)
  r2dbc:
    url: ${QUOTA_DB_URL:r2dbc:postgresql://localhost:5432/turing}
    username: ${QUOTA_DB_USERNAME:postgres}
    password: ${QUOTA_DB_PASSWORD:postgres}
    pool:
      initial-size: ${QUOTA_DB_POOL_INITIAL:5}
      max-size: ${QUOTA_DB_POOL_MAX:20}
      max-idle-time: ${QUOTA_DB_POOL_IDLE:30m}
      max-acquire-time: ${QUOTA_DB_POOL_ACQUIRE:3s}
      max-create-connection-time: ${QUOTA_DB_POOL_CREATE:3s}
      
  # Redis Configuration for Quota Caching
  redis:
    quota:
      host: ${QUOTA_REDIS_HOST:localhost}
      port: ${QUOTA_REDIS_PORT:6379}
      password: ${QUOTA_REDIS_PASSWORD:}
      database: ${QUOTA_REDIS_DATABASE:0}
      timeout: ${QUOTA_REDIS_TIMEOUT:2s}
      lettuce:
        pool:
          max-active: ${QUOTA_REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${QUOTA_REDIS_POOL_MAX_IDLE:8}
          min-idle: ${QUOTA_REDIS_POOL_MIN_IDLE:0}
          max-wait: ${QUOTA_REDIS_POOL_MAX_WAIT:-1ms}
          
  # Security Configuration
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-for-quota-management-change-in-production}
      expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
      
  # Flyway Database Migration
  flyway:
    enabled: ${QUOTA_FLYWAY_ENABLED:true}
    url: ${QUOTA_FLYWAY_URL:jdbc:postgresql://localhost:5432/turing}
    user: ${QUOTA_FLYWAY_USER:postgres}
    password: ${QUOTA_FLYWAY_PASSWORD:postgres}
    locations: ${QUOTA_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${QUOTA_FLYWAY_BASELINE:true}
    validate-on-migrate: ${QUOTA_FLYWAY_VALIDATE:true}
    
# Management and Monitoring Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,quota-health
      cors:
        allowed-origins: ${QUOTA_METRICS_CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
        allowed-methods: GET,POST
        
  metrics:
    export:
      prometheus:
        enabled: ${QUOTA_PROMETHEUS_ENABLED:true}
        step: ${QUOTA_PROMETHEUS_STEP:30s}
        descriptions: true
        
    tags:
      service: smart-home-management
      environment: ${QUOTA_ENVIRONMENT:development}
      
  health:
    redis:
      enabled: true
    db:
      enabled: true

# Logging Configuration
logging:
  level:
    com.ashelabs.turing: ${QUOTA_LOG_LEVEL:INFO}
    com.ashelabs.turing.service: ${QUOTA_SERVICE_LOG_LEVEL:DEBUG}
    org.springframework.r2dbc: ${QUOTA_R2DBC_LOG_LEVEL:WARN}
    org.springframework.data.redis: ${QUOTA_REDIS_LOG_LEVEL:WARN}
    reactor.netty: ${QUOTA_NETTY_LOG_LEVEL:WARN}
    
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{50}] - %msg%n"
    
# Quota Management System Configuration
quota:
  # Global Feature Flags
  enabled: ${QUOTA_ENABLED:false}
  beta-mode: ${QUOTA_BETA_MODE:false}
  emergency-disable: ${QUOTA_EMERGENCY_DISABLE:false}
  
  # Rollout Configuration
  rollout-percentage: ${QUOTA_ROLLOUT_PERCENTAGE:0}
  enabled-households: ${QUOTA_ENABLED_HOUSEHOLDS:}
  disabled-households: ${QUOTA_DISABLED_HOUSEHOLDS:}
  
  # Validation Performance Settings
  validation:
    timeout: ${QUOTA_VALIDATION_TIMEOUT:100ms}
    cache-ttl: ${QUOTA_CACHE_TTL:3600s}
    short-cache-ttl: ${QUOTA_SHORT_CACHE_TTL:300s}
    max-retries: ${QUOTA_VALIDATION_RETRIES:2}
    
  # Usage Tracking Configuration
  usage-tracking:
    enabled: ${QUOTA_USAGE_TRACKING_ENABLED:true}
    batch-size: ${QUOTA_USAGE_BATCH_SIZE:100}
    flush-interval: ${QUOTA_USAGE_FLUSH_INTERVAL:30s}
    session-timeout: ${QUOTA_SESSION_TIMEOUT:24h}
    
  # Notification Configuration
  notifications:
    enabled: ${QUOTA_NOTIFICATIONS_ENABLED:true}
    warning-threshold: ${QUOTA_WARNING_THRESHOLD:75}
    violation-threshold: ${QUOTA_VIOLATION_THRESHOLD:100}
    cooldown-period: ${QUOTA_NOTIFICATION_COOLDOWN:300s}
    
  # Enforcement Configuration
  enforcement:
    enabled: ${QUOTA_ENFORCEMENT_ENABLED:true}
    grace-period: ${QUOTA_GRACE_PERIOD:300s}
    max-grace-uses: ${QUOTA_MAX_GRACE_USES:1}
    emergency-override-enabled: ${QUOTA_EMERGENCY_OVERRIDE:true}
    
  # Cache Configuration
  cache:
    default-ttl: ${QUOTA_CACHE_DEFAULT_TTL:3600s}
    balance-ttl: ${QUOTA_CACHE_BALANCE_TTL:1800s}
    config-ttl: ${QUOTA_CACHE_CONFIG_TTL:86400s}
    session-ttl: ${QUOTA_CACHE_SESSION_TTL:86400s}
    
  # Performance Monitoring
  performance:
    slow-query-threshold: ${QUOTA_SLOW_QUERY_THRESHOLD:100ms}
    enable-query-logging: ${QUOTA_QUERY_LOGGING:false}
    circuit-breaker-enabled: ${QUOTA_CIRCUIT_BREAKER:true}
    circuit-breaker-threshold: ${QUOTA_CIRCUIT_BREAKER_THRESHOLD:50}
    circuit-breaker-timeout: ${QUOTA_CIRCUIT_BREAKER_TIMEOUT:30s}

# Profile-specific overrides
---
spring:
  config:
    activate:
      on-profile: development
      
quota:
  enabled: true
  beta-mode: true
  rollout-percentage: 100
  
logging:
  level:
    com.ashelabs.turing: DEBUG
    
---
spring:
  config:
    activate:
      on-profile: test
      
quota:
  enabled: true
  rollout-percentage: 100
  
  validation:
    timeout: 50ms
    
  cache:
    default-ttl: 60s
    
---
spring:
  config:
    activate:
      on-profile: production
      
quota:
  enabled: ${QUOTA_PRODUCTION_ENABLED:false}
  beta-mode: false
  
  validation:
    timeout: 75ms
    max-retries: 3
    
logging:
  level:
    com.ashelabs.turing: WARN
    
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus