# Base Configuration - Common settings across all environments
spring.application.name=turing-server

# Default active profile (development)
spring.profiles.active=dev

# MQTT Configuration
mqtt.broker-url=${MQTT_BROKER_URL:10.0.16.3}
mqtt.broker-port=${MQTT_BROKER_PORT:1883}
mqtt.username=${MQTT_BROKER_USERNAME:mqtt-service}
mqtt.password=${MQTT_BROKER_PASSWORD:asus1122334455}
mqtt.client-id=${MQTT_CLIENT_ID:turing-server-${random.uuid}}
mqtt.keep-alive-interval=${MQTT_KEEP_ALIVE:30}
mqtt.connection-timeout=${MQTT_CONNECTION_TIMEOUT:60}
mqtt.clean-session=${MQTT_CLEAN_SESSION:true}
mqtt.reconnect-attempts=${MQTT_RECONNECT_ATTEMPTS:10}
mqtt.reconnect-delay=${MQTT_RECONNECT_DELAY:3000}
mqtt.base-topic=${MQTT_BASE_TOPIC:mitsubishi2mqtt}

# Server Configuration
server.port=8081
server.servlet.context-path=/
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write_dates_as_timestamps=false

# WebSocket will be configured programmatically in WebSocketConfig

# Redis Configuration (base)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

# Redis Quota-Specific Configuration
spring.data.redis.quota.host=${QUOTA_REDIS_HOST:localhost}
spring.data.redis.quota.port=${QUOTA_REDIS_PORT:6379}
spring.data.redis.quota.password=${QUOTA_REDIS_PASSWORD:}
spring.data.redis.quota.database=${QUOTA_REDIS_DATABASE:0}
spring.data.redis.quota.timeout=${QUOTA_REDIS_TIMEOUT:2s}
spring.data.redis.quota.lettuce.pool.max-active=${QUOTA_REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.quota.lettuce.pool.max-idle=${QUOTA_REDIS_POOL_MAX_IDLE:8}
spring.data.redis.quota.lettuce.pool.min-idle=${QUOTA_REDIS_POOL_MIN_IDLE:0}
spring.data.redis.quota.lettuce.pool.max-wait=${QUOTA_REDIS_POOL_MAX_WAIT:-1ms}

# Database Configuration (R2DBC) - Base settings
spring.r2dbc.url=${DB_URL:r2dbc:postgresql://localhost:5432/turing}
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:postgres}
spring.r2dbc.pool.initial-size=${DB_POOL_INITIAL:5}
spring.r2dbc.pool.max-size=${DB_POOL_MAX:20}
spring.r2dbc.pool.max-idle-time=${DB_POOL_IDLE:30m}
spring.r2dbc.pool.max-acquire-time=${DB_POOL_ACQUIRE:3s}
spring.r2dbc.pool.max-create-connection-time=${DB_POOL_CREATE:3s}

# Flyway Database Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.url=${FLYWAY_URL:jdbc:postgresql://localhost:5432/turing}
spring.flyway.user=${FLYWAY_USER:postgres}
spring.flyway.password=${FLYWAY_PASSWORD:postgres}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE:true}

# Security Configuration
spring.security.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-quota-management-change-in-production}
spring.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Quota Management System Configuration
quota.enabled=${QUOTA_ENABLED:false}
quota.beta-mode=${QUOTA_BETA_MODE:false}
quota.emergency-disable=${QUOTA_EMERGENCY_DISABLE:false}
quota.rollout-percentage=${QUOTA_ROLLOUT_PERCENTAGE:0}
quota.enabled-households=${QUOTA_ENABLED_HOUSEHOLDS:}
quota.disabled-households=${QUOTA_DISABLED_HOUSEHOLDS:}

# Quota Validation Performance Settings
quota.validation.timeout=${QUOTA_VALIDATION_TIMEOUT:100ms}
quota.validation.cache-ttl=${QUOTA_CACHE_TTL:3600s}
quota.validation.short-cache-ttl=${QUOTA_SHORT_CACHE_TTL:300s}
quota.validation.max-retries=${QUOTA_VALIDATION_RETRIES:2}

# Quota Usage Tracking Configuration
quota.usage-tracking.enabled=${QUOTA_USAGE_TRACKING_ENABLED:true}
quota.usage-tracking.batch-size=${QUOTA_USAGE_BATCH_SIZE:100}
quota.usage-tracking.flush-interval=${QUOTA_USAGE_FLUSH_INTERVAL:30s}
quota.usage-tracking.session-timeout=${QUOTA_SESSION_TIMEOUT:24h}

# Quota Notification Configuration
quota.notifications.enabled=${QUOTA_NOTIFICATIONS_ENABLED:true}
quota.notifications.warning-threshold=${QUOTA_WARNING_THRESHOLD:75}
quota.notifications.violation-threshold=${QUOTA_VIOLATION_THRESHOLD:100}
quota.notifications.cooldown-period=${QUOTA_NOTIFICATION_COOLDOWN:300s}

# Quota Enforcement Configuration
quota.enforcement.enabled=${QUOTA_ENFORCEMENT_ENABLED:true}
quota.enforcement.grace-period=${QUOTA_GRACE_PERIOD:300s}
quota.enforcement.max-grace-uses=${QUOTA_MAX_GRACE_USES:1}
quota.enforcement.emergency-override-enabled=${QUOTA_EMERGENCY_OVERRIDE:true}

# Quota Cache Configuration
quota.cache.default-ttl=${QUOTA_CACHE_DEFAULT_TTL:3600s}
quota.cache.balance-ttl=${QUOTA_CACHE_BALANCE_TTL:1800s}
quota.cache.config-ttl=${QUOTA_CACHE_CONFIG_TTL:86400s}
quota.cache.session-ttl=${QUOTA_CACHE_SESSION_TTL:86400s}

# Quota Performance Monitoring
quota.performance.slow-query-threshold=${QUOTA_SLOW_QUERY_THRESHOLD:100ms}
quota.performance.enable-query-logging=${QUOTA_QUERY_LOGGING:false}
quota.performance.circuit-breaker-enabled=${QUOTA_CIRCUIT_BREAKER:true}
quota.performance.circuit-breaker-threshold=${QUOTA_CIRCUIT_BREAKER_THRESHOLD:50}
quota.performance.circuit-breaker-timeout=${QUOTA_CIRCUIT_BREAKER_TIMEOUT:30s}

# Management and Monitoring Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,quota-health
management.endpoints.web.cors.allowed-origins=${METRICS_CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
management.endpoints.web.cors.allowed-methods=GET,POST
management.metrics.export.prometheus.enabled=${PROMETHEUS_ENABLED:true}
management.metrics.export.prometheus.step=${PROMETHEUS_STEP:30s}
management.metrics.export.prometheus.descriptions=true
management.metrics.tags.service=smart-home-management
management.metrics.tags.environment=${ENVIRONMENT:development}
management.health.redis.enabled=true
management.health.db.enabled=true

# Logging Configuration
logging.level.com.ashelabs.turing=${LOG_LEVEL:INFO}
logging.level.com.ashelabs.turing.service=${SERVICE_LOG_LEVEL:DEBUG}
logging.level.com.ashelabs.turing.websocket=DEBUG
logging.level.org.springframework.r2dbc=${R2DBC_LOG_LEVEL:WARN}
logging.level.org.springframework.data.redis=${REDIS_LOG_LEVEL:WARN}
logging.level.reactor.netty=${NETTY_LOG_LEVEL:WARN}
logging.level.org.eclipse.paho.client.mqttv3=INFO
logging.level.org.springframework.messaging=DEBUG
logging.level.io.rsocket=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{50}] - %msg%n
