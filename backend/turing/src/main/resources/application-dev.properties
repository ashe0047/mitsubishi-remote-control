# Development Environment Configuration
# This profile is for development and testing with quota system features

# Environment identifier
ENVIRONMENT=development

# Development Database Configuration
DB_URL=${QUOTA_DB_URL:r2dbc:postgresql://10.0.17.1:5432/turing_dev}
DB_USERNAME=${QUOTA_DB_USERNAME:postgres}
DB_PASSWORD=${QUOTA_DB_PASSWORD:postgres}

# Spring R2DBC Development Configuration
spring.r2dbc.pool.initial-size=${DB_POOL_INITIAL:5}
spring.r2dbc.pool.max-size=${DB_POOL_MAX:20}
spring.r2dbc.pool.max-idle-time=${DB_POOL_MAX_IDLE:10m}

# Development Flyway Configuration
FLYWAY_URL=${QUOTA_FLYWAY_URL:jdbc:postgresql://10.0.17.1:5432/turing_dev}
FLYWAY_USER=${QUOTA_FLYWAY_USER:postgres}
FLYWAY_PASSWORD=${QUOTA_FLYWAY_PASSWORD:postgres}
FLYWAY_ENABLED=${QUOTA_FLYWAY_ENABLED:true}

# Development Redis Configuration
spring.data.redis.host=${REDIS_HOST:10.0.17.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:200ms}
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:10}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:5}

# Development MQTT Configuration
# Environment variable defaults are handled in application.properties

# Development Server Configuration
server.port=${SERVER_PORT:8081}

# Development Logging - More verbose for debugging
LOG_LEVEL=DEBUG
SERVICE_LOG_LEVEL=DEBUG
R2DBC_LOG_LEVEL=INFO
REDIS_LOG_LEVEL=INFO
NETTY_LOG_LEVEL=INFO

# Development Quota Management - Enabled for testing
quota.enabled=${QUOTA_ENABLED:true}
quota.feature.enabled=${QUOTA_FEATURE_ENABLED:true}
quota.feature.rollout.percentage=${QUOTA_ROLLOUT_PERCENTAGE:100}
quota.beta-mode=true
quota.emergency-disable=${QUOTA_EMERGENCY_DISABLE:false}

# Development Quota Performance Settings - Relaxed for development
quota.validation.timeout=${QUOTA_VALIDATION_TIMEOUT:200ms}
quota.validation.max-retries=${QUOTA_VALIDATION_RETRIES:2}
quota.cache.default-ttl=${QUOTA_CACHE_DEFAULT_TTL:300s}
quota.cache.balance-ttl=${QUOTA_CACHE_BALANCE_TTL:180s}
quota.cache.config-ttl=${QUOTA_CACHE_CONFIG_TTL:600s}
quota.cache.session-ttl=${QUOTA_CACHE_SESSION_TTL:3600s}
quota.cache.ttl.hours=${QUOTA_CACHE_TTL_HOURS:1}
quota.circuit.breaker.threshold=${QUOTA_CIRCUIT_BREAKER_THRESHOLD:5}
quota.circuit.breaker.recovery.minutes=${QUOTA_CIRCUIT_BREAKER_RECOVERY:2}

# Development Monitoring - Open endpoints for development
management.endpoints.web.exposure.include=health,metrics,info,env
management.endpoints.web.cors.allowed-origins=*
PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:true}

# Development Security - Default values for development
JWT_SECRET=${JWT_SECRET:dev-secret-key-change-in-production}
JWT_EXPIRATION=${JWT_EXPIRATION:86400000}

# Development Quota Settings - Enabled for development and testing
quota.usage-tracking.enabled=${QUOTA_USAGE_TRACKING_ENABLED:true}
quota.notifications.enabled=${QUOTA_NOTIFICATIONS_ENABLED:true}
quota.enforcement.enabled=${QUOTA_ENFORCEMENT_ENABLED:true}
quota.performance.enable-query-logging=${QUOTA_QUERY_LOGGING:true}
quota.performance.circuit-breaker-enabled=${QUOTA_CIRCUIT_BREAKER:true}
quota.performance.circuit-breaker-threshold=${QUOTA_CIRCUIT_BREAKER_THRESHOLD:20}
quota.performance.circuit-breaker-timeout=${QUOTA_CIRCUIT_BREAKER_TIMEOUT:15s}

# Development Quota Usage Tracking
quota.usage-tracking.batch-size=${QUOTA_USAGE_BATCH_SIZE:50}
quota.usage-tracking.flush-interval=${QUOTA_USAGE_FLUSH_INTERVAL:10s}
quota.usage-tracking.session-timeout=${QUOTA_SESSION_TIMEOUT:4h}

# Development Quota Notifications
quota.notifications.warning-threshold=${QUOTA_WARNING_THRESHOLD:75}
quota.notifications.violation-threshold=${QUOTA_VIOLATION_THRESHOLD:100}
quota.notifications.cooldown-period=${QUOTA_NOTIFICATION_COOLDOWN:60s}

# Development Quota Enforcement
quota.enforcement.grace-period=${QUOTA_GRACE_PERIOD:60s}
quota.enforcement.max-grace-uses=${QUOTA_MAX_GRACE_USES:3}
quota.enforcement.emergency-override-enabled=${QUOTA_EMERGENCY_OVERRIDE:true}

# Development Async Processing Configuration
quota.tracking.thread.pool.size=${QUOTA_TRACKING_THREAD_POOL:5}
quota.tracking.queue.capacity=${QUOTA_TRACKING_QUEUE_CAPACITY:500}

# Development Security Settings - Show errors for debugging
server.error.include-stacktrace=on_param
server.error.include-message=always
