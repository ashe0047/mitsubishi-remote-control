# Test Environment Configuration
# This profile is for running tests with optimized settings

# Environment identifier
ENVIRONMENT=test

# Test Database Configuration
DB_URL=r2dbc:postgresql://localhost:5432/turing_test
DB_USERNAME=postgres
DB_PASSWORD=postgres
DB_POOL_INITIAL=1
DB_POOL_MAX=5

# Test Flyway Configuration
FLYWAY_URL=jdbc:postgresql://localhost:5432/turing_test
FLYWAY_USER=postgres
FLYWAY_PASSWORD=postgres

# Test Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=2

# Test MQTT Configuration
MQTT_BROKER_URL=localhost
MQTT_BROKER_PORT=1883
MQTT_BROKER_USERNAME=test-mqtt
MQTT_BROKER_PASSWORD=test-password

# Test Server Configuration
server.port=0

# Test Logging - Balanced for test performance
LOG_LEVEL=INFO
SERVICE_LOG_LEVEL=INFO
R2DBC_LOG_LEVEL=WARN
REDIS_LOG_LEVEL=WARN
NETTY_LOG_LEVEL=WARN

# Test Quota Management - Enabled for testing
quota.enabled=true
quota.beta-mode=false
quota.emergency-disable=false
quota.rollout-percentage=100

# Test Quota Performance Settings - Optimized for test speed
quota.validation.timeout=50ms
quota.validation.max-retries=1
quota.cache.default-ttl=60s
quota.cache.balance-ttl=30s
quota.cache.config-ttl=300s
quota.cache.session-ttl=300s

# Test Monitoring - Minimal for performance
management.endpoints.web.exposure.include=health
PROMETHEUS_ENABLED=false

# Test Security
JWT_SECRET=test-jwt-secret-key-for-testing-only
JWT_EXPIRATION=3600000

# Test Quota Settings
quota.usage-tracking.enabled=true
quota.notifications.enabled=false
quota.enforcement.enabled=true
quota.performance.enable-query-logging=false
quota.performance.circuit-breaker-enabled=false
